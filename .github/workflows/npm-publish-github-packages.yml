# Publish to npm registry when package.json changes on main.
# Node 24+ bundles npm >= 11.15, required for `npm stage publish`.

name: publish package

on:
  push:
    branches:
    - main
    paths:
    - package.json

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: |
          cp package.json dist/package.json
          cp Readme.md dist/Readme.md
          cd dist
          npm stage publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}